workflows:
  ios-unsigned:
    name: iOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Configure Google Sign-In
        script: |
          PLIST=$CM_BUILD_DIR/ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :GIDClientID string 193867110649-qre2c5jeqjrrpkjkqk06ljl2sdvstmi1.apps.googleusercontent.com" $PLIST
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload
          zip -r WC2026.ipa Payload
    artifacts:
      - build/ios/iphoneos/WC2026.ipa